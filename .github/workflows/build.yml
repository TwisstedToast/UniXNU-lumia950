name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    # Both manual jobs are long (edk2 and the macOS Xcode build) and are wanted
    # separately, so a dispatch names which one to run instead of starting both.
    inputs:
      target:
        description: Which manual job to run
        type: choice
        options: [payload, kernel, both]
        default: payload

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # Keep build output outside both checkouts' defaults, so the paths are the same
  # on every runner and the artifact globs below stay simple.
  UNIXNU_OUT: ${{ github.workspace }}/out

jobs:
  # Fast checks that run everywhere. These need no Xcode and no phone.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 1a01c2afa197d975d04da892325c56b6b14aaecb
          path: unixnu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Carry the 16.x line into the base checkout
        # The 8796 overlay and the per-line patch selection live in UniXNU, but this account
        # cannot push there. ci/unixnu-16x.patch carries that change until it is upstream; a
        # checkout that already has it makes the shim a no-op.
        run: |
          if git -C unixnu apply --reverse --check "$GITHUB_WORKSPACE/ci/unixnu-16x.patch" >/dev/null 2>&1; then
            echo "already in the base checkout; not applying the shim"
          else
            git -C unixnu apply "$GITHUB_WORKSPACE/ci/unixnu-16x.patch"
          fi

      - name: Parse board.toml and the defconfig
        run: |
          python3 - <<'PY'
          import pathlib, re, tomllib
          board = tomllib.loads(pathlib.Path("board.toml").read_text())
          assert board["board"]["name"] == "lumia950", board["board"]
          assert board["kernel"]["defconfig"] == "lumia950_defconfig"
          assert "cpus=1" in board["payload"]["kernel_args"]
          config = pathlib.Path("configs/lumia950_defconfig").read_text().splitlines()
          keys = [line.split("=", 1)[0].strip() for line in config
                  if line.strip() and not line.startswith("#")]
          assert "CONFIG_XNU_NATIVE_SDHCI" in keys, keys
          assert "CONFIG_XNU_NATIVE_ADRENO418" in keys, keys
          assert "CONFIG_XNU_NATIVE_MDSS" in keys, keys
          assert "CONFIG_XNU_BUILD_ARCHIVES" in keys, keys
          assert "CONFIG_XNU_EXTRA_LD_ARCHIVES" in keys, keys
          archives = board["kernel"]["archives"]
          assert "build-arm-driver.py NativeLegacyDisplay" in archives, archives
          assert pathlib.Path("drivers/NativeLegacyDisplay/NativeLegacyDisplay.cpp").is_file()
          # The GPU driver is built from the same list, and its personality and ADT
          # node are only meaningful together with the archive.
          assert "build-arm-driver.py NativeAdreno418" in archives, archives
          assert pathlib.Path("drivers/NativeAdreno418/Info.plist").is_file()
          # The display driver has the same three parts: archive, config, ADT node.
          assert "build-arm-driver.py NativeMdss" in archives, archives
          assert pathlib.Path("drivers/NativeMdss/Info.plist").is_file()
          ipsw = board["ipsw"]
          assert ipsw["url"].startswith("https://updates.cdn-apple.com/"), ipsw["url"]
          assert ipsw["version"].startswith("16."), ipsw  # the port stays on 16.x
          assert ipsw["version"] in ipsw["url"] and ipsw["build"] in ipsw["url"], ipsw
          assert ipsw["product"] == "iPhone10,6" and ipsw["device_class"] == "d221ap", ipsw
          assert ipsw["chip_id"] == 0x8015 and ipsw["board_id"] == 14, ipsw
          # The merge step names the 16.x kernel, pins the 16.7.16 kernelcache and lists a
          # root set; a missing or empty section would silently go back to the prelink gate.
          prelink = board["kernel"]["prelink"]
          assert prelink["tool"] == "kits/NativePrelink/emit_prelink.py", prelink
          assert prelink["kernel"].startswith("build/xnu/ios-obj/"), prelink["kernel"]
          assert prelink["kernel"].endswith(".unstripped"), prelink["kernel"]
          assert re.fullmatch(r"[0-9a-f]{64}", prelink["kernelcache_sha256"]), prelink
          slide = int(prelink["slide"], 0)
          assert slide % 4096 == 0 and slide != 0, slide
          roots = prelink["roots"]
          assert "com.apple.filesystems.apfs" in roots and "com.apple.iokit.IOStorageFamily" in roots, roots
          print("board.toml and defconfig: ok")
          PY

      - name: Check real 16.x clock discovery for an identity-mapped native bus
        run: |
          mkdir -p work/clock-reference
          source=https://raw.githubusercontent.com/apple-oss-distributions/xnu/1b191cb58250d0705d8a51287127505aa4bc0789
          curl -fsSL "$source/pexpert/arm/pe_identify_machine.c" -o work/clock-reference/pe_identify_machine.c
          curl -fsSL "$source/osfmk/arm64/machine_routines.c" -o work/clock-reference/machine_routines.c
          curl -fsSL "$source/makedefs/MakeInc.def" -o work/clock-reference/MakeInc.def
          curl -fsSL "$source/osfmk/kern/startup.c" -o work/clock-reference/startup.c
          python3 scripts/test-native-clocks.py --identify work/clock-reference/pe_identify_machine.c \
              --routines work/clock-reference/machine_routines.c
          python3 scripts/test-xnu-build-flags.py --make-def work/clock-reference/MakeInc.def \
              --startup work/clock-reference/startup.c --bootstrap-patch unixnu/patches/xnu/source-corecrypto14-bootstrap.patch

      - name: Check graphics startup against original and custom Lumia firmware tables
        run: |
          source=https://raw.githubusercontent.com/WOA-Project/Lumia950XLPkg/0e7e24adb2ac80672ade1e56f9b538d99941328f
          mkdir -p work/graphics-reference/AcpiTables/8992/src
          for table in DSDT_MSFT.asl DSDT.asl; do
            curl -fsSL "$source/AcpiTables/8992/src/$table" -o "work/graphics-reference/AcpiTables/8992/src/$table"
          done
          python3 scripts/check-graphics-profile.py --firmware-root work/graphics-reference
          python3 scripts/check-secure-smmu-profile.py --firmware-root work/graphics-reference
          mkdir -p work/graphics-reference/PrePi
          for file in HvcPatch.h Pi.c; do
            curl -fsSL "$source/PrePi/$file" -o "work/graphics-reference/PrePi/$file"
          done
          python3 scripts/check-oem-scm-profile.py --firmware-root work/graphics-reference

      - name: The 16.x patch line has no holes
        # feeds.toml moves the build to xnu-8796.141.3, and UniXNU carries that line's patch
        # overlay. A skip must name a base patch and state why: an omission that outlives its
        # patch would hide a lost fix. A replacement must shadow a base patch, because the
        # build applies it in that patch's place and order.
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          feeds = tomllib.loads(pathlib.Path("feeds.toml").read_text())
          xnu = next(s for s in feeds["source"] if s["name"] == "xnu")
          assert xnu["ref"] == f"xnu-{xnu['version']}", xnu
          line = "xnu-" + xnu["version"].split(".")[0]
          base = pathlib.Path("unixnu/patches/xnu")
          overlay = pathlib.Path("unixnu/patches") / line
          skips = {}
          for row in (overlay / "skip.txt").read_text().splitlines():
              if not row.strip() or row.lstrip().startswith("#"):
                  continue
              name, _, reason = row.partition(":")
              skips[name.strip()] = reason.strip()
          assert skips, "skip.txt names nothing"
          for name, reason in skips.items():
              assert (base / f"{name}.patch").is_file(), name
              assert reason, name
          names = {p.stem for p in overlay.glob("*.patch")}
          replaced = {name for name in names if (base / f"{name}.patch").is_file()}
          added = names - replaced
          assert not replaced & set(skips), replaced & set(skips)
          # The kernel this board links must satisfy the merge: the sparse-index ABI the
          # prelink tool checks for, and the one symbol the 16.7.16 APFS imports that the
          # published 8796 source does not define.
          for needed in ("native-prelink-sparse-index", "vfs-getvfs-with-vfsops"):
              assert needed in added, needed
          assert "native-prelink-security-init" in added
          print(f"{line}: {len(replaced)} replaced, {len(added)} added, {len(skips)} skipped")
          PY

      - name: Check the build scripts
        run: |
          python3 -m py_compile scripts/build-arm-driver.py scripts/ci-clear-example.py scripts/check-payload.py \
              scripts/get-ntfs-driver.py scripts/make-lumia950-adt.py scripts/check-adt.py \
              scripts/check-gpu-addon.py scripts/check-screenshot.py scripts/panel.py \
              scripts/stage-kernel.py scripts/check-probe-image.py \
              scripts/test-probe-qemu.py scripts/test-handoff-qemu.py scripts/adreno-firmware.py \
              scripts/test-gpu-tools.py scripts/prepare-armcpu.py scripts/test-armcpu-patch.py \
              scripts/check-oem-scm-profile.py scripts/test-oem-scm-profile.py \
              scripts/test-gicv2-qemu.py scripts/probe_fat.py scripts/test-probe-fat.py
          bash -n scripts/build-payload.sh scripts/build-probe.sh scripts/test-probe.sh scripts/test-gpu.sh scripts/test-storage.sh \
              scripts/test-gicv2.sh scripts/build-gicv2-test.sh scripts/test-report.sh

      - name: Check the chainload payload configuration
        # The keys and enums are the ones UniXNULib/Config.c reads, so a typo fails here
        # rather than as an error line on a phone screen.
        run: python3 scripts/check-payload.py

      - name: Validate the source-only native bring-up contract
        run: |
          python3 scripts/test-native-bringup.py
          python3 scripts/test-native-install.py
          python3 -m py_compile scripts/test-native-xnu-entry.py

      - name: The kernel stage composes with the menu stage
        # The marker the stager replaces lives in the menu configuration, and the tree it adds
        # to must carry the loader. If either drifts, this has to fail here rather than on a
        # phone that boots a menu with no kernel behind it.
        run: |
          mkdir -p build
          python3 -c "import struct,pathlib;p=pathlib.Path('build/ci-kernel.macho');p.write_bytes(struct.pack('<IIIIIIII',0xfeedfacf,0x0100000c,0,2,1,8,0,0)+b'\\0'*8)"
          cp -r payload build/menu
          mkdir -p build/menu/EFI/UniXNU/Drivers
          : > build/menu/EFI/UniXNU/Drivers/DarwinBoot.efi
          python3 scripts/stage-kernel.py --kernel build/ci-kernel.macho \
              --unique-chip-id 1122334455667788 --menu-tree build/menu --out build/boot
          grep -q 'default = "xnu"' build/boot/EFI/UniXNU/unixnu.toml
          test -s build/boot/EFI/UniXNU/Payloads/kernel.macho.adt

      - name: The split tree keeps the kernel off EFIESP
        # The prelinked kernel is 56 MB and EFIESP is 32 MB, so the kernel and its sidecars go
        # to MainOS while the menu, its configuration and the driver that reads MainOS stay on
        # EFIESP. The checker has to accept that arrangement and reject a name in neither tree.
        run: |
          : > build/ntfs.efi
          printf 'MZ' | dd of=build/ntfs.efi conv=notrunc status=none
          python3 scripts/stage-kernel.py --kernel build/ci-kernel.macho \
              --unique-chip-id 1122334455667788 --menu-tree build/menu \
              --ntfs-driver build/ntfs.efi --out build/boot-efiesp \
              --payload-out build/boot-mainos
          grep -q 'path = "Drivers/ntfs.efi"' build/boot-efiesp/EFI/UniXNU/unixnu.toml
          test -f build/boot-efiesp/EFI/UniXNU/Drivers/ntfs.efi
          test ! -e build/boot-efiesp/EFI/UniXNU/Payloads
          test -s build/boot-mainos/EFI/UniXNU/Payloads/kernel.macho.adt
          set +e
          out=$(python3 scripts/check-payload.py --config build/boot-efiesp/EFI/UniXNU/unixnu.toml \
              --payload-dir build/boot-efiesp 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "::error::the checker passed an EFIESP tree whose kernel is nowhere"
            exit 1
          fi

      - name: The ADT generator and its checker
        # DarwinBoot hands this tree to XNU. The checker parses it with the encoding XNU reads,
        # and --self-test proves it rejects defects instead of only accepting good input.
        run: |
          python3 scripts/make-lumia950-adt.py --output build/lumia950.adt \
              --dram-size 0xC0000000 --unique-chip-id 1122334455667788 --chip-id 0x8015 \
              --owned-memory-size 0x20000000
          python3 scripts/check-adt.py build/lumia950.adt
          python3 scripts/check-adt.py --self-test
          # The GPU node is the only thing that makes the driver matchable. The
          # checker above rejects a wrong shape; this proves the node is there at
          # all, in the tree the phone is given.
          grep -qa "kgsl@fdb00000" build/lumia950.adt

      - name: Host tests of the driver cores
        run: |
          mkdir -p build
          bash scripts/test-storage.sh
          bash scripts/test-gicv2.sh
          bash scripts/test-gpu.sh
          g++ -std=c++17 -Wall -Wextra -Werror -I drivers/NativeMdss \
              drivers/NativeMdss/Test/check-mdss-core.cpp \
              drivers/NativeMdss/MdssCore.cpp -o build/check-mdss-core
          ./build/check-mdss-core

      - name: Host tests of the firmware probe and framebuffer renderer
        run: bash scripts/test-probe.sh

      - name: The GPU addon checker rejects what the phone would choke on
        # Rung 6 hands the Metal plugin over as one blob. This repository does not write
        # that format, so the only thing it can prove here is that a blob is read the way
        # the kernel reads it and that the plugin inside was built for iOS 16: the one
        # published for this GPU targets 17, and that failure is silent on the phone.
        run: python3 scripts/check-gpu-addon.py --self-test

      - name: The build driver accepts this board
        run: |
          cd unixnu
          python3 unixnu defconfig lumia950_defconfig -D "$GITHUB_WORKSPACE"
          python3 unixnu status -D "$GITHUB_WORKSPACE" | tee status.txt
          grep -q "driver   NativeSdhci              device" status.txt
          grep -q "driver   NativeAdreno418          device" status.txt

      - name: The incomplete-board guard still holds
        run: |
          # example = true must keep build and bootimg refused until the board is real.
          cd unixnu
          set +e
          out=$(python3 unixnu build kernel --dry-run -D "$GITHUB_WORKSPACE" 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "::error::build ran for an example board"
            exit 1
          fi
          echo "$out" | grep -q "EXAMPLE device repository"

  efi-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UNIXNU_EDK2: ${{ github.workspace }}/work/edk2-headers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tianocore/edk2
          ref: 5c148d5a90825929283615136c20127bd7d14a69
          path: work/edk2-headers
          sparse-checkout: MdePkg/Include
      - name: Install standalone EFI validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld qemu-system-arm qemu-efi-aarch64 qemu-utils
      - name: Test report failures and clock lookup without hardware access
        run: bash scripts/test-report.sh
      - name: Build the actual AArch64 EFI applications
        run: PROBE_ENTRY=LumiaGpuProbe bash scripts/build-probe.sh out/gpu-preflight
      - name: Verify firmware refusal and real file persistence
        run: |
          firmware=/usr/share/AAVMF/AAVMF_CODE.fd
          if [ ! -f "$firmware" ]; then firmware=/usr/share/qemu-efi-aarch64/QEMU_EFI.fd; fi
          test -s "$firmware"
          for gic in 2 3; do
            python3 scripts/test-probe-qemu.py --application gpu --esp out/gpu-preflight/esp \
              --firmware "$firmware" --gic-version "$gic" --log "out/gpu-preflight/readonly-gic$gic.log"
            python3 scripts/test-probe-qemu.py --application gpu --esp out/gpu-preflight/esp \
              --firmware "$firmware" --gic-version "$gic" --writable-report-test \
              --log "out/gpu-preflight/report-write-gic$gic.log"
          done
      - name: Refuse native RPM handoff on unsupported hardware
        run: |
          mkdir -p out/rpm-handoff/esp/EFI/BOOT out/rpm-handoff/esp/EFI/LumiaProbe
          cp out/gpu-preflight/esp/EFI/LumiaProbe/LumiaRpmHandoff.efi out/rpm-handoff/esp/EFI/BOOT/BOOTAA64.EFI
          cp out/gpu-preflight/esp/EFI/LumiaProbe/LumiaRpmHandoff.efi out/rpm-handoff/esp/EFI/LumiaProbe/
          firmware=/usr/share/AAVMF/AAVMF_CODE.fd
          if [ ! -f "$firmware" ]; then firmware=/usr/share/qemu-efi-aarch64/QEMU_EFI.fd; fi
          for gic in 2 3; do
            python3 scripts/test-probe-qemu.py --application rpm --esp out/rpm-handoff/esp \
              --firmware "$firmware" --gic-version "$gic" --log "out/rpm-handoff/refusal-gic$gic.log"
          done
      - name: Exercise actual EL1 MMIO abort recovery and refuse native GPU on unsupported hardware
        run: |
          firmware=/usr/share/AAVMF/AAVMF_CODE.fd
          if [ ! -f "$firmware" ]; then firmware=/usr/share/qemu-efi-aarch64/QEMU_EFI.fd; fi
          for application in NativeMmioTest LumiaGpuPower; do
            mkdir -p "out/$application/esp/EFI/BOOT"
            cp "out/gpu-preflight/esp/EFI/LumiaProbe/$application.efi" "out/$application/esp/EFI/BOOT/BOOTAA64.EFI"
          done
          for gic in 2 3; do
            python3 scripts/test-probe-qemu.py --application guard --esp out/NativeMmioTest/esp \
              --firmware "$firmware" --gic-version "$gic" --log "out/NativeMmioTest/guard-gic$gic.log"
            python3 scripts/test-probe-qemu.py --application native-gpu --esp out/LumiaGpuPower/esp \
              --firmware "$firmware" --gic-version "$gic" --log "out/LumiaGpuPower/refusal-gic$gic.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumia950-efi-preflight
          path: |
            out/gpu-preflight/**
            out/rpm-handoff/**
            out/NativeMmioTest/**
            out/LumiaGpuPower/**

  gicv2-emulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/ArmCpu
          ref: 9066b53bbc82e92a98ec44a11dd50fd13eaf1a1b
          path: work/armcpu-reference
      - name: Install standalone AArch64 validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld qemu-system-arm
      - name: Verify the pinned ArmCpu integration source
        run: |
          python3 scripts/test-armcpu-patch.py work/armcpu-reference/ArmCpu.cpp
          python3 scripts/prepare-armcpu.py work/armcpu-reference/ArmCpu.cpp out/gicv2-validation/ArmCpu.cpp
      - name: Exercise actual AArch64 IRQ exceptions
        run: |
          bash scripts/build-gicv2-test.sh
          python3 scripts/test-gicv2-qemu.py build/gicv2-qemu/gicv2-test.elf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumia950-gicv2-core-emulation
          path: |
            out/gicv2-validation/**
            build/gicv2-qemu/gicv2-test*.elf
            build/gicv2-qemu/native-runtime-*.elf

  # The chainload payload: UniXNU.efi, DarwinBoot.efi and unixnu.toml in the EFIESP layout.
  # Manual like the kernel job: it clones edk2 and builds BaseTools, which is minutes of
  # runner time for files that only change when the menu or the loader does.
  payload:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'payload' || inputs.target == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNIXNU_EDK2: ${{ github.workspace }}/edk2
      UNIXNU_SOURCE: ${{ github.workspace }}/unixnu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 1a01c2afa197d975d04da892325c56b6b14aaecb
          path: unixnu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the EDK II host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev nasm iasl clang lld llvm
          clang --version | head -1
          ld.lld --version | head -1

      - name: Fetch the DarwinBoot submodule
        run: git -C unixnu submodule update --init --depth 1 drivers/DarwinBoot

      - name: Fetch edk2
        # package/build.sh names release/202608 and checks for MdePkg/BaseFdtLib and
        # MipiSysTLib, so those submodules are initialized with it.
        run: |
          git clone --depth 1 --branch release/202608 \
            https://github.com/microsoft/mu_basecore "$UNIXNU_EDK2"
          git -C "$UNIXNU_EDK2" submodule update --init --depth 1 \
            MdePkg/Library/BaseFdtLib/libfdt \
            MdePkg/Library/MipiSysTLib/mipisyst \
            BaseTools/Source/C/BrotliCompress/brotli
          if [ -f "$UNIXNU_EDK2/pip-requirements.txt" ]; then
            python3 -m pip install --user -q -r "$UNIXNU_EDK2/pip-requirements.txt"
          fi

      - name: Build and stage the payload
        run: bash scripts/build-payload.sh out/payload

      - uses: actions/upload-artifact@v4
        with:
          name: lumia950-payload
          path: out/payload/**
          if-no-files-found: error
          retention-days: 7

  # The real compile. The kernel step needs macOS: Xcode and the iphoneos SDK.
  # Manual, because a first build takes a long time on a shared runner.
  kernel:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'kernel' || inputs.target == 'both')
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      # prepare-xnu-source.py asks api.github.com for directory listings, and anonymous
      # calls are rate limited per IP; shared runner IPs are usually over the limit.
      # ci-tools/sitecustomize.py adds this token to api.github.com requests only.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}/ci-tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: 1a01c2afa197d975d04da892325c56b6b14aaecb
          path: unixnu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Carry the 16.x line into the base checkout
        # Same shim as the validate job: the 8796 overlay and the per-line patch selection
        # until they are in UniXNU itself.
        run: |
          if git -C unixnu apply --reverse --check "$GITHUB_WORKSPACE/ci/unixnu-16x.patch" >/dev/null 2>&1; then
            echo "already in the base checkout; not applying the shim"
          else
            git -C unixnu apply "$GITHUB_WORKSPACE/ci/unixnu-16x.patch"
          fi

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Prepare the build copy
        # The committed board keeps example = true so nothing pretends this port is
        # complete. CI builds from a scratch copy with the guard cleared, and only for
        # the duration of the run. If the build ever needs an edit here, that is a sign
        # the board is missing something real.
        run: |
          mkdir -p "$RUNNER_TEMP/device"
          rsync -a --exclude .git --exclude build --exclude out ./ "$RUNNER_TEMP/device/"
          python3 scripts/ci-clear-example.py "$RUNNER_TEMP/device/board.toml"

      - name: Select the device and fetch the Apple references
        run: |
          cd unixnu
          python3 unixnu defconfig lumia950_defconfig -D "$RUNNER_TEMP/device"
          python3 unixnu fetch xnu libplatform libdispatch AvailabilityVersions \
              libpthread corecrypto-2023 IOStorageFamily -D "$RUNNER_TEMP/device"

      - name: Build the kernel, the device archives and the prelinked image
        # feeds.toml pins the 16.x tree, so the compile is the right source line for this
        # 16.7.16 image, and [kernel.prelink] pins the kernelcache the merge consumes. The
        # kernel step compiles, builds the archives, links, then runs the prelink against
        # that cache. Every stop fails the job now: there is no gate left to tolerate.
        run: |
          set +e
          cd unixnu
          python3 unixnu build kernel -D "$RUNNER_TEMP/device" 2>&1 | tee "$GITHUB_WORKSPACE/kernel.log"
          status=${PIPESTATUS[0]}
          set -e

          archive=$(find "$UNIXNU_OUT" -name 'libNativeSdhci.a' -print -quit || true)
          if [ -z "$archive" ]; then
            echo "::error::NativeSdhci was not compiled; the build stopped before the archives"
            exit 1
          fi
          echo "archive: $archive"

          if [ "$status" -ne 0 ]; then
            echo "::error::the kernel step failed"
            exit 1
          fi

          prelinked=$(find "$UNIXNU_OUT" -path '*/kernel/kernel.macho' -print -quit || true)
          if [ -z "$prelinked" ]; then
            echo "::error::the kernel step succeeded without writing a prelinked image"
            exit 1
          fi
          echo "prelinked: $prelinked"
          file "$prelinked"
          shasum -a 256 "$prelinked"
          file "$prelinked" | grep -q 'Mach-O 64-bit executable arm64' || {
            echo "::error::the prelinked image is not an arm64 Mach-O executable"
            exit 1
          }
          report=${prelinked%.macho}.json
          python3 - "$report" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print(f"components {len(report['components'])}: {report['components']}")
          print(f"kernel interfaces {len(report['kernel_interfaces'])}, bindings {len(report['bindings'])}")
          assert report['components'], 'the prelink selected no component'
          assert report['bindings'], 'the prelink rebound nothing'
          assert report['sparse_index']['headers'], 'no sparse prelink index'
          assert report['loadable'] is False, 'the tool no longer marks the candidate unqualified'
          PY

      - name: Name the first compile error
        # util.run keeps a command's output in the log file and echoes only its last 30
        # lines, which are the make recursion and not the cause. The first error line is.
        if: always()
        run: |
          for file in "$UNIXNU_OUT"/*/logs/kernel*.log; do
            [ -f "$file" ] || continue
            echo "== $file"
            grep -n -m 5 -E 'error:|fatal error' "$file" || echo "no error line in $file"
          done

      - name: Record what the driver compiled against
        # The archive succeeding is the compile proof, but only if the log says which
        # members went in: a core that is listed in build-arm-driver.py's sources and
        # missing from this list is a core that was never compiled for ARM64.
        if: always()
        run: |
          find "$UNIXNU_OUT" \( -name 'libArmCpu.a' -o -name 'libNativeSdhci.a' -o -name 'libNativeLegacyDisplay.a' \
            -o -name 'libNativeAdreno418.a' \) -exec shasum -a 256 {} \;
          for archive in "$UNIXNU_OUT"/*/tree/build/*/lib*.a; do
            echo "== $archive"
            xcrun ar t "$archive" || ar t "$archive" || true
          done
          grep -h "NativeSdhci\|NativeAdreno418\|NativeLegacyDisplay\|archive" \
            "$UNIXNU_OUT"/*/logs/archive-*.log | tail -20 || true



      - uses: actions/upload-artifact@v4
        # always(): the compile log is what a failed run has to hand over, and every
        # step after the failing one is skipped by default.
        if: always()
        with:
          name: lumia950-kernel
          path: |
            out/*/tree/build/xnu/ios-obj/*/mach.development.bcm2837
            out/*/tree/build/xnu/ios-obj/*/mach.development.bcm2837.unstripped
            out/*/tree/build/native-sdhci/**
            out/*/tree/build/armcpu/**
            out/*/tree/build/native-adreno418/**
            out/*/tree/build/native-mdss/**
            out/*/tree/build/native-legacy-display/**
            out/*/kernel/**
            out/*/logs/**
            kernel.log
          if-no-files-found: warn
          retention-days: 7

      - name: Remove fetched sources
        if: always()
        run: |
          rm -rf out/ipsw out/feeds out/*/tree
          rm -f unixnu/unixnu.lock
