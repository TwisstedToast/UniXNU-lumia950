# Board description of the Microsoft Lumia 950 (MSM8992, Snapdragon 808), read by the unixnu
# build driver.
#
# P1 research skeleton. The incomplete-board guard is intentional: this board cannot build a
# boot image yet, and it must not pretend to. Unknown sections are absent rather than filled
# with zero addresses or invented hashes. Remove `example = true` only when every section
# below exists and has been checked on hardware.

[board]
name = "lumia950"
soc = "MSM8992"
description = "Microsoft Lumia 950 — P1 build research"
kit = "lumia950"                   # package/ of this repository becomes kits/lumia950
example = true

[kernel]
defconfig = "lumia950_defconfig"
# Archive builders of the kernel step, in order. Names are files of the build tree's
# scripts/ directory, so they carry no path. The corecrypto pair comes first because
# ArmCpu is only accepted with the real source crypto provider; ArmDTPlatform is the
# platform expert that consumes the ADT; ArmCpu owns the CPU, timer and interrupt path;
# NativeSdhci is this device's eMMC driver (see drivers/NativeSdhci and README.md).
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeSdhci",
  # Rung 1 of the GPU (see README.md, "The GPU"): identity only. It is built so
  # the archive and the personality cannot drift from the ADT node; it publishes
  # no GPU service, so linking it changes nothing a client can find.
  "build-arm-driver.py NativeAdreno418",
  # Rung 1 of the display (README.md, "The display path"): the windows map, the
  # mdss domain is proved on, and the firmware's DSI state is logged. It publishes
  # no framebuffer, so linking it changes nothing a client can draw into.
  "build-arm-driver.py NativeMdss",
  # Link input, not a driver: upstream calls native_legacy_display_probe() from
  # bsd_init.c without the XNU_NATIVE_LEGACY_DISPLAY guard every other call site has,
  # so the kernel needs the symbol even with the flag off. The defconfig force-loads
  # this archive through XNU_EXTRA_LD_ARCHIVES.
  "build-arm-driver.py NativeLegacyDisplay",
  # "build-arm-driver.py NativeRamBlock",   # Data volume; also needs the virtio bindings builder
]
# TODO: obtain the real userdata GPT geometry (first_lba, last_lba) read-only from the phone.

# The Apple reference image: iPhone X, iOS 16.7.16. The port requires 16.x, so the kernel
# source and the kernelcache kexts come from the same line: feeds.toml pins
# xnu-8796.141.3 and patches/xnu-8796/ adapts the patch set to it. The kernelcache this
# board merges is pinned under [kernel.prelink].
#
# The identity is the phone-shaped one: iPhone10,6 (d221ap), one of the two products this
# restore serves (iPhone10,3 is d22ap). The pinned values were read from the image's own
# BuildManifest over HTTP range requests, not from a listing.
[ipsw]
url = "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
product = "iPhone10,6"
version = "16.7.16"
build = "20H392"
device_class = "d221ap"
chip_id = 0x8015
board_id = 14
# DeviceTree and the trust caches join this list when the payload and boot stages exist and
# name their inputs.
fetch = ["KernelCache"]

# The merge step: the 16.x kernel from source plus the kexts of the 16.7.16 kernelcache.
# The input is the unstripped link the kernel step leaves behind, because this line's
# makefiles publish no `.noctf` output: CTF is a 17.x kernel feature, so there is nothing
# to strip from the 16.x image.
#
# kernelcache_sha256 is the arm64 slice of the IPSW's KernelCache IM4P after LZFSE
# decoding: 50,937,856 bytes out of kernelcache.release.iphone10b, read from this image
# with HTTP range requests. It ties the merge to the component ABI the kernel was built
# against; scripts/unixnu/kernel.py refuses any other cache before merging.
#
# slide = native __PRELINK_TEXT (0xfffffff004004000, ARM64_PLKSEG_ADDR of the kernel
# script) minus the cache's (0xfffffff004dc8000). It maps the four coalesced ranges 4K
# aligned to the base of the 48 MiB kext window, below the native __TEXT at
# 0xfffffff007004000 and clear of every native segment; the tool refuses any placement
# that would collide, and the address of the gap is not arbitrary: the kernel derives the
# ranges from these segment commands.
#
# roots are the kernelcache components this port uses and does not replace with source:
# the APFS root volume, its decmpfs provider, the storage stack that publishes IOMedia,
# and corecrypto (the source corecrypto is linked in as well). The closure also carries
# AppleEffaceableStorage, CoreAnalyticsFamily, IOCryptoAcceleratorFamily, AppleImage4 and
# CoreTrust, which those declare as libraries; they have no matching node in the ADT and
# stay unstarted. Userland components stay out until userland is in scope: the defconfig
# is the storage bring-up. com.apple.kec.Libm is deliberately absent — nothing selected
# depends on it, and its 16.7.16 __text embeds a constant table the prelink's instruction
# inventory does not recognise and refuses to copy. early_security_init is absent too:
# the address of an AMFI initializer in this cache has not been qualified here, and an
# unqualified address is worse than none.
[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped"
kernelcache_sha256 = "2ec297bac95bcba01046fd0148e97e7e5885c05a6c18827f39f534ba375c1221"
slide = "-0xdc4000"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.kec.corecrypto",
]

# [firmware] stays absent on purpose. The route is chainload: the phone's own UEFI
# (Lumia950XLPkg) starts \EFI\UniXNU\UniXNU.efi from EFIESP, so this repository builds no
# firmware volume and `unixnu build firmware` has nothing to do here. Mu-Silicium is not the
# base either: it has no MSM8992 target and its delivery model is an Android boot image for
# `fastboot boot`, which a Lumia does not have. See README.md, "The boot route".

# The kernel stage: the values scripts/stage-kernel.py reads when it puts a kernel beside the
# menu in the chainload tree. This board never goes through `unixnu payload` or `unixnu bootimg`
# — a Lumia has no Android boot image — so the boot-image keys (size_mib, volume) stay unused,
# and the tree is copied onto EFIESP or the microSD card as files.
[payload]
title = "iOS 16.7.16"
# One verbose line. DarwinBoot copies it into boot_args unchanged and refuses more than 1000
# bytes; `--args` replaces it for one staging run without editing this file.
kernel_args = ["-v", "cpus=1"]
# 3 GiB: the figure the ADT generator and its checker were exercised with in CI, not a
# measurement from this phone. The firmware's own memory map still has to be read on the
# handset — reserved regions carve into the DRAM the OS may own — so treat this as the first
# value to confirm on hardware, not as a claim about the device.
dram_size = 0xC0000000
dram_base = 0
# The menu's countdown stays in payload/EFI/UniXNU/unixnu.toml, where the panel stage already
# has it, so there is one place to change it. A staged tree makes the kernel the default
# entry, so a boot test needs no key press.
[payload.adt]
# The Apple flattened encoding with this SoC's addresses, a /chosen NVRAM proxy and the
# memory-map placeholders DarwinBoot fills in (`/chosen/memory-map/{RAMDisk,PackedRAMDisk,
# TrustCache}`). The validate job runs the generator and the checker, including the checker's
# defect self-test.
tool = "scripts/make-lumia950-adt.py"
# The firmware MADT's list: four A53s in cluster 0, two A57s in cluster 1, boot CPU first. A
# phone that reports a different boot core is a one-line change here, not a driver change.
cpu_regs = "0,1,2,3,0x100,0x101"
# PSCI on 8992/8994 is conveyed over HVC and it is incomplete: no SYSTEM_OFF and no
# SYSTEM_RESET, which is why the menu's two power actions are firmware ResetSystem calls.
psci_method = "hvc"
chip_id = 0x8015
